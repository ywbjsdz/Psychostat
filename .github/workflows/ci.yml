# Psychostat Windows CI：数值回归测试 + 三分支冒烟测试（stats/CTT/IRT 最小模拟）
name: CI

# 首次公开发布时改为手动触发：本工作流尚未在 GitHub 托管机上验证过
# （未安装 TAM/ltm/OpenMx/semTools 等 IRT 依赖，且含需要交互桌面的 GUI 自检），
# 自动跑会直接飘红。等依赖装齐、GUI 自检改为无头模式后再改回 push 触发。
on:
  workflow_dispatch:
  pull_request:

jobs:
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies (Word result reports, pinned)
        run: pip install -r requirements-lock.txt

      - name: Install R packages (stats / CTT / IRT)
        run: |
          Rscript -e "options(repos = c(CRAN = 'https://cloud.r-project.org')); install.packages(c('yaml','jsonlite','car','emmeans','nortest','onewaytests','pwr','ggplot2','readxl','haven','MASS','psych','lavaan','GPArotation','mirt'), quiet = TRUE)"
          # 版本锁定参考 renv.lock（本地复现：Rscript -e "install.packages('renv'); renv::restore()"）

      - name: Environment pre-flight (R discovery, locale cleanup, writable probe)
        run: |
          . ./psychostat_env.ps1
          $r = Initialize-PsychostatEnvironment
          Write-Host "Rscript resolved: $r"
          if (-not $r) { Write-Error 'Environment pre-flight failed'; exit 1 }

      - name: Numeric regression tests (golden values + SPSS alignment)
        run: ./tests/run_numeric_tests.ps1

      - name: GUI self-test (layout / step switching / wizard / anti-occlusion)
        run: powershell -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File ./scripts/psychostat_gui.ps1 -SelfTest

      - name: Sensitive-data check (no real data staged)
        run: ./scripts/check_sensitive.ps1

      - name: End-to-end smoke tests (stats + CTT + IRT simulated)
        run: ./tests/smoke_test.ps1 -Full

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psychostat-outputs-${{ github.run_id }}
          path: outputs/
          retention-days: 3
