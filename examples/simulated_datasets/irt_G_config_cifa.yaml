# IRT-G（验证路线 CIFA）：按 irt_G_loading_matrix.csv 验证 3 维结构
# 用法：Rscript scripts/irt_generic_pipeline.R --config examples/simulated_datasets/<本文件>
input:
  mode: file
  path: "./irt_G_multidimensional_gpcm_n900_items24.csv"
  item_columns: auto
  missing: none            # none 与 pairwise 等价；listwise 会先删人
analysis:
  model: mirt
  mirt_mode: cifa
  selection_criterion: BIC
  compute_m2: true
  mirt_item_model: gpcm
  loading_matrix: "./irt_G_loading_matrix.csv"
output:
  directory: "../../outputs"
  report_languages: [zh, en]
  save_model_object: true
