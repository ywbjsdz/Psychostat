# IRT-H：二分 3PL 数据（1500 人 × 20 题，猜测参数 c∈[0.08,0.25]）
# 用法：Rscript scripts/irt_generic_pipeline.R --config examples/simulated_datasets/<本文件>
input:
  mode: file
  path: "./irt_H_binary_3pl_n1500_items20.csv"
  item_columns: auto
  missing: none            # none 与 pairwise 等价；listwise 会先删人
analysis:
  model: 3pl
  mirt_mode: eifa
  selection_criterion: BIC
  compute_m2: true
  compare_models: [2pl, 3pl]   # 教学点：真有猜测时 3PL 的 BIC 应优于 2PL
output:
  directory: "../../outputs"
  report_languages: [zh, en]
  save_model_object: true
