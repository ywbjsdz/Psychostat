# IRT-E：真 Rasch 数据（500 人 × 15 题，所有题目区分度 a = 1）
# 用法：Rscript scripts/irt_generic_pipeline.R --config examples/simulated_datasets/<本文件>
input:
  mode: file
  path: "./irt_E_rasch_n500_items15.csv"
  item_columns: auto
  missing: none            # none 与 pairwise 等价；listwise 会先删人
analysis:
  model: auto
  mirt_mode: eifa
  selection_criterion: BIC
  compute_m2: true
  compare_models: [rasch, 2pl]   # 教学点：真模型是 Rasch 时 BIC 应偏向 rasch
output:
  directory: "../../outputs"
  report_languages: [zh, en]
  save_model_object: true
