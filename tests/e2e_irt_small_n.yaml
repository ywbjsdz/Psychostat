# 边界测试夹具（对应修复 R3）：小样本 IRT。
# n = 40、10 道二分题、显式 2PL。修复前**没有任何提示**就会出结果；
# 修复后 irt_preflight 应给出"样本量仅 40…"的警告（n<50），提醒结果不可用于结论。
input:
  mode: file
  path: "./data/irt_small_n40_items10.csv"
  item_columns: auto
  missing: none
analysis:
  model: 2pl
  mirt_mode: eifa
  selection_criterion: BIC
  compute_m2: false
output:
  directory: "../outputs"
  project_label: e2e_irt_small_n
  report_languages: [zh]
  save_model_object: false
